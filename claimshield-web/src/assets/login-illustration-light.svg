<svg width="640" height="620" viewBox="0 0 640 620" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Claim protection overview</title>
  <desc>Abstract illustration of a shield protecting a vehicle, surrounded by four labelled cards - photos, inspection, documents, and approved - representing the stages of a claim.</desc>

  <defs>
    <filter id="cardShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1f5fbf" flood-opacity="0.14" />
    </filter>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eaf1fc" />
      <stop offset="100%" stop-color="#cfe0f7" />
    </linearGradient>
  </defs>

  <circle cx="320" cy="300" r="230" fill="none" stroke="#c7d5ea" stroke-width="2" stroke-dasharray="1 10" />

  <g fill="#dbe6f5">
    <circle cx="72" cy="96" r="7" />
    <circle cx="560" cy="540" r="6" />
    <circle cx="580" cy="140" r="5" />
    <circle cx="60" cy="480" r="6" />
  </g>

  <g transform="translate(320 372)">
    <path d="M-64 26 L-58 -2 Q-54 -18 -34 -18 L34 -18 Q54 -18 58 -2 L64 26 Z" fill="#0d4a44" />
    <rect x="-70" y="24" width="140" height="16" rx="8" fill="#0f6e63" />
    <circle cx="-40" cy="42" r="12" fill="#0a1930" />
    <circle cx="40" cy="42" r="12" fill="#0a1930" />
    <rect x="-40" y="-10" width="30" height="14" rx="3" fill="#eaf1fc" opacity="0.8" />
    <rect x="10" y="-10" width="30" height="14" rx="3" fill="#eaf1fc" opacity="0.8" />
  </g>

  <g transform="translate(320 300)">
    <path d="M-118 -50 L-118 30 Q-118 128 0 178 Q118 128 118 30 L118 -50 L0 -100 Z" fill="url(#shieldFill)" stroke="#1f5fbf" stroke-width="3" filter="url(#cardShadow)" />
    <path d="M-44 4 L-12 42 L52 -28" fill="none" stroke="#1f5fbf" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <rect transform="translate(100 168)" x="-68" y="-42" width="148" height="84" rx="14" fill="#ffffff" filter="url(#cardShadow)" />
  <g transform="translate(100 168)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <circle cx="-36" cy="0" r="20" fill="#eaf1fc" />
    <path d="M-46 -2 L-42 -10 L-30 -10 L-26 -2 L-46 -2 Z M-44 0 a8 8 0 1 0 16 0 a8 8 0 1 0 -16 0" fill="none" stroke="#1f5fbf" stroke-width="2" stroke-linejoin="round" />
    <text x="-2" y="-6" font-size="12" font-weight="700" fill="#1a1d21">Photos</text>
    <text x="-2" y="12" font-size="9.5" fill="#7a8492">Snap &amp; upload</text>
  </g>

  <rect transform="translate(548 216)" x="-68" y="-42" width="148" height="84" rx="14" fill="#ffffff" filter="url(#cardShadow)" />
  <g transform="translate(548 216)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <circle cx="-36" cy="0" r="20" fill="#eaf1fc" />
    <path d="M-44 -6 L-37 1 L-28 -12" fill="none" stroke="#0f6e63" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="-36" cy="0" r="13" fill="none" stroke="#0f6e63" stroke-width="2" />
    <text x="-2" y="-6" font-size="12" font-weight="700" fill="#1a1d21">Inspection</text>
    <text x="-2" y="12" font-size="9.5" fill="#7a8492">Site verified</text>
  </g>

  <rect transform="translate(112 452)" x="-68" y="-42" width="148" height="84" rx="14" fill="#ffffff" filter="url(#cardShadow)" />
  <g transform="translate(112 452)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <rect x="-56" y="-20" width="20" height="26" rx="3" fill="#eaf1fc" stroke="#1f5fbf" stroke-width="2" />
    <path d="M-52 -12 L-42 -12 M-52 -6 L-42 -6" stroke="#1f5fbf" stroke-width="2" stroke-linecap="round" />
    <text x="-2" y="-6" font-size="12" font-weight="700" fill="#1a1d21">Documents</text>
    <text x="-2" y="12" font-size="9.5" fill="#7a8492">Full report</text>
  </g>

  <rect transform="translate(552 472)" x="-68" y="-42" width="148" height="84" rx="14" fill="#ffffff" filter="url(#cardShadow)" />
  <g transform="translate(552 472)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <circle cx="-36" cy="0" r="20" fill="#eaf1fc" />
    <text x="-36" y="6" text-anchor="middle" font-size="18" font-weight="700" fill="#1f5fbf">₹</text>
    <text x="-2" y="-6" font-size="12" font-weight="700" fill="#1a1d21">Approved</text>
    <text x="-2" y="12" font-size="9.5" fill="#7a8492">Claim settled</text>
  </g>

  <g stroke="#c7d5ea" stroke-width="1.5" stroke-dasharray="1 6">
    <path d="M158 176 L232 232" />
    <path d="M488 224 L408 262" />
    <path d="M168 452 L236 392" />
    <path d="M490 460 L410 420" />
  </g>
</svg>
